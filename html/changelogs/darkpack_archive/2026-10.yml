2026-10-05:
  FalloutFalcon:
  - rscadd: 所有狼人出身都有3种独特天赋，每个部族现在也至少
      拥有1种独特天赋。
  - rscadd: 新增狼人天赋：原始怒意、蜕毛、猿工赐福、城市奔行、
      驭火之主、野兔之跃、感官强化、掠食者武装、
      猎隼之握、怒火引导、感知魔法、心鼓之律。
  - refactor: 掷骰结果的接收对象现在由一组标记决定，可以更精细地
      控制接收对象，包括按检定成功与否区分。
  - qol: 掷骰消息现在根据接收者生成，接收者可以看到
      掷骰者在自己名册中的姓名。
  - balance: 挣脱束缚现在采用类似扯断手铐的系统，
      以敏捷加潜行进行逃脱检定。
  - bugfix: 修复了加值有时只显示出来，
      却没有真正加入骰池的问题。
  - code_imp: 掷骰时会传入行动所用的物品（如有）。
  - code_imp: 整理了难度等掷骰数值的辅助方法。
  - code_imp: 所有魔法物品现在都会返回魔法类型数据，包含
      强度和魔法种类等信息，例如鲜血、灵性或时间。
  - code_imp: 添加效果，用于表示多数天赋或律能留下的残留魔法。
  - code_imp: 重做妖精视界，按物品散发的魔法源进行探测，
      不再显示目标身上的所有物品。
  - code_imp: 器官现在会记录上一次连接的宿主。
  - code_imp: 添加通用的已观察目标记录系统，供
      心鼓之律以及多种血族律能等
      需要记录目标的能力复用。
  Uristthedorf:
  - bugfix: 蛇形术一级的描述不再暗示其具有精神控制能力。
  breadcrombs:
  - rscadd: 戴上暗影面具现在会使受术者更难被观察或检查。
